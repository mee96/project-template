name: CI

# Builds the frontend and checks the backend on every push and pull request
# to main/develop. Each job skips itself if its folder is not set up yet.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test --if-present -- --watch=false --browsers=ChromeHeadless

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/requirements.txt') != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check that every module compiles
        run: python -m compileall -q .
      - name: Run tests
        run: |
          if [ -d tests ]; then pip install pytest && pytest -q; else echo "No tests/ folder yet"; fi
